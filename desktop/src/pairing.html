<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Pair Whizz Desktop</title>
<style>
  body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#0f1115;color:#e6e8ec;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  .card{max-width:380px;width:100%;padding:32px;background:#171a21;border:1px solid #2a2e38;border-radius:14px;text-align:center;}
  h1{font-size:18px;margin:0 0 8px;}
  p{font-size:13px;color:#9aa0ab;line-height:1.5;margin:0 0 20px;}
  input{width:100%;box-sizing:border-box;padding:12px;font-size:20px;letter-spacing:0.15em;text-align:center;text-transform:uppercase;border-radius:8px;border:1px solid #2a2e38;background:#0f1115;color:#e6e8ec;margin-bottom:14px;}
  button{width:100%;padding:12px;font-size:14px;font-weight:600;border-radius:8px;border:0;background:#4f7cff;color:#fff;cursor:pointer;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  .err{color:#ff6b6b;font-size:12px;margin-top:12px;min-height:16px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Pair Whizz Desktop</h1>
    <p>In Whizz on your browser, open the "Desktop App" button in the sidebar and generate a pairing code. Enter it below.</p>
    <input id="code" maxlength="8" placeholder="ABCD1234" autofocus/>
    <button id="submit" onclick="claim()">Connect</button>
    <div class="err" id="err"></div>
  </div>
  <script>
    async function claim(){
      const btn=document.getElementById('submit'), err=document.getElementById('err');
      const code=document.getElementById('code').value.trim();
      if(!code){err.textContent='Enter the pairing code first.';return;}
      btn.disabled=true; err.textContent='';
      try{
        const claimRes=await fetch('/api/desktop/pair/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});
        const claimData=await claimRes.json();
        if(!claimRes.ok) throw new Error(claimData.error||'Invalid or expired code.');
        const saveRes=await fetch('/local/save-token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:claimData.token})});
        if(!saveRes.ok) throw new Error('Could not save the pairing token locally.');
        window.location.href='/index.html';
      }catch(e){
        err.textContent=e.message||'Something went wrong.';
        btn.disabled=false;
      }
    }
    document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')claim();});
  </script>
</body>
</html>
