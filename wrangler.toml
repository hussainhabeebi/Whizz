name = "whizz"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
LEAD_COLLECTOR_URL = "https://collector.whizzfze.com"
LEAD_INTELLIGENCE_CALLBACK_URL = "https://tiarafzco.com/api/lead-intelligence/callback"
# Chatwoot (app.aiingo.com) — conversations are read/sent through its API directly.
# Fill in the real account id and inbox id below, then set the API token as a secret
# (never a plain var): `wrangler secret put CHATWOOT_API_TOKEN`.
CHATWOOT_BASE_URL = "https://app.aiingo.com"
CHATWOOT_ACCOUNT_ID = "11"
CHATWOOT_INBOX_ID = "73"

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "whizz-db"
database_id = "028d5b86-352e-4809-87d1-02e2bfc34a69"
