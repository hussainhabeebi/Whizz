name = "whizz"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
LEAD_COLLECTOR_URL = "https://collector.whizzfze.com"
LEAD_INTELLIGENCE_CALLBACK_URL = "https://tiarafzco.com/api/lead-intelligence/callback"
# Chatwoot (app.aiingo.com) is configured from the Integrations page in the app, not here —
# base URL, account id, API token (encrypted) and inboxes all live in D1. The token is
# encrypted with the same key as Lead Intelligence's directory credentials — the
# LEAD_INTELLIGENCE_KEY secret below must already be set.

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "whizz-db"
database_id = "028d5b86-352e-4809-87d1-02e2bfc34a69"

[ai]
binding = "AI"

[triggers]
# Drives genuinely time-staged campaign rollout (worker/routes/stagedCampaigns.js) — each
# tick sends the next due batch for every active staged run. Only takes effect once
# deployed (`wrangler deploy`, already part of `npm run deploy`); editing this file alone
# does not activate it on the already-running Worker.
crons = ["*/15 * * * *"]
