name: Build Desktop App

# Builds on windows-latest specifically because producing a real Windows .exe reliably
# needs an actual Windows toolchain (for native module rebuilding and the NSIS installer
# step) — cross-compiling one from Linux/macOS isn't dependable. This is the guaranteed
# path to a working installer regardless of where desktop/'s source was written.
on:
  push:
    branches: [main]
    paths: ['desktop/**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Each push to desktop/** becomes its own GitHub Release, tagged by version — that's
      # the update feed electron-updater polls, so the version must strictly increase every
      # build. GITHUB_RUN_NUMBER is per-workflow and monotonic, so 1.0.<run_number> is always
      # a valid next version with zero manual bumping.
      - name: Set release version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = '1.0.' + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # --publish always both builds the installer and publishes it (plus the latest.yml
      # electron-updater needs) to a GitHub Release tagged with the version above.
      - run: npm run build:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: whizz-desktop-windows
          path: desktop/release/*.exe
          if-no-files-found: error
