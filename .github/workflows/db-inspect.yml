name: Inspect D1 schema (read-only)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: List tables on remote D1
        run: npx wrangler d1 execute whizz-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check whether d1_migrations tracking table exists and what it holds
        run: npx wrangler d1 execute whizz-db --remote --command "SELECT name FROM d1_migrations ORDER BY id;" || echo "d1_migrations table does not exist yet"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
